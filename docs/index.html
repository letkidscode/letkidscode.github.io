	<style>
		:root {
			--bg: #eeeeee;
			--ink: #1f1d3a;
			--muted: #6b6886;
			--pink: #ff5d8f;
			--yellow: #ffc93c;
			--blue: #3ec5ff;
			--green: #4ade80;
			--purple: #8b5cf6;
			--orange: #ff8a3d;
			--tile: 300px;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html { background: var(--bg); }

		body {
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			background: var(--bg) url('./assets/images/school-doodles.svg') 0 0 / var(--tile) var(--tile) repeat;
			color: var(--ink);
			animation: pan 90s linear infinite;
			font-family: 'Nunito', system-ui, sans-serif;
			overflow-x: hidden;
		}

		/* ---------- school doodle background ---------- */
		@keyframes pan {
			to { background-position: var(--tile) var(--tile); }
		}

		/* ---------- main card ---------- */
		main {
			position: relative;
			z-index: 1;
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 48px 16px 24px;
		}

		.card {
			max-width: 620px;
			width: 100%;
			text-align: center;
			background: #fff;
			border: 3px solid var(--ink);
			border-radius: 28px;
			box-shadow: 8px 8px 0 var(--ink);
			padding: 44px 32px 40px;
			animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) both;
		}

		@keyframes pop {
			from { transform: scale(.8) translateY(30px); opacity: 0; }
			to   { transform: scale(1) translateY(0); opacity: 1; }
		}

		/* bubbling beaker */
		.beaker { position: relative; display: inline-block; font-size: 4.2rem; line-height: 1; color: var(--orange); margin-bottom: 18px; }
		.beaker i { display: inline-block; transform-origin: 50% 90%; animation: swirl 2.4s ease-in-out infinite; }

		.beaker::before, .beaker::after {
			content: '';
			position: absolute;
			bottom: 60%;
			width: .16em;
			height: .16em;
			border-radius: 50%;
			background: var(--orange);
			opacity: 0;
			animation: bubble 1.8s ease-out infinite;
		}
		.beaker::before { left: 25%; }
		.beaker::after  { left: 55%; width: .12em; height: .12em; animation-delay: .9s; }

		@keyframes swirl {
			0%, 100% { transform: rotate(-10deg); }
			50%      { transform: rotate(10deg); }
		}

		@keyframes bubble {
			0%   { transform: translateY(0) scale(.6); opacity: 0; }
			20%  { opacity: .9; }
			100% { transform: translateY(-.7em) scale(1); opacity: 0; }
		}

		h1 {
			font-family: 'Fredoka', sans-serif;
			font-weight: 700;
			font-size: clamp(1.9rem, 6vw, 3.2rem);
			line-height: 1.1;
			margin-bottom: 18px;
		}

		h1 .word { display: inline-block; animation: bounce 2.4s ease-in-out infinite; }
		h1 .word:nth-child(1) { color: var(--pink);   animation-delay: 0s; }
		h1 .word:nth-child(2) { color: var(--purple); animation-delay: .12s; }
		h1 .word:nth-child(3) { color: var(--blue);   animation-delay: .24s; }
		h1 .word:nth-child(4) { color: var(--green);  animation-delay: .36s; }

		@keyframes bounce {
			0%, 60%, 100% { transform: translateY(0); }
			30%           { transform: translateY(-10px); }
		}

		p.lead {
			font-size: 1.15rem;
			line-height: 1.6;
			color: var(--muted);
			max-width: 460px;
			margin: 0 auto 30px;
		}

		p.lead strong { color: var(--ink); }

		.cta {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-family: 'Fredoka', sans-serif;
			font-weight: 600;
			font-size: 1.2rem;
			color: var(--ink);
			text-decoration: none;
			background: var(--pink);
			border: 3px solid var(--ink);
			border-radius: 999px;
			padding: 14px 30px;
			box-shadow: 4px 4px 0 var(--ink);
			transition: transform .15s ease, box-shadow .15s ease;
		}

		.cta:hover, .cta:focus-visible {
			transform: translate(-2px, -2px) rotate(-2deg);
			box-shadow: 6px 6px 0 var(--ink);
		}

		.cta:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }

		.cta .arrow { display: inline-block; transition: transform .2s ease; }
		.cta:hover .arrow { transform: translateX(4px); }

		/* ---------- fine print ---------- */
		footer {
			text-align: center;
			font-size: .8rem;
			line-height: 1.7;
			color: var(--muted);
			padding: 16px 16px 28px;
		}

		footer a { color: var(--muted); text-decoration: none; }
		footer a:hover { color: var(--ink); }
		/* logo PNG has a white box with lots of padding: crop to the mark and multiply the white away */
		footer .logo { width: 72px; height: 72px; margin: 0 auto 8px; overflow: hidden; position: relative; mix-blend-mode: multiply; }
		footer .logo img { position: absolute; width: 180px; left: -52px; top: -45px; }

		footer .brand {
			font-family: 'Fredoka', sans-serif;
			font-weight: 700;
			font-size: 1.05rem;
			color: var(--ink);
			margin-bottom: 8px;
		}

		/* contacts | socials, each column left-aligned, pair centred */
		footer .cols { display: flex; justify-content: center; gap: 12px 48px; }
		footer ul { list-style: none; text-align: left; }
		footer li a { display: inline-flex; align-items: center; padding: 2px 0; }
		footer i { color: var(--purple); width: 1.1em; margin-right: 6px; text-align: center; }

		@media (max-width: 480px) {
			main { padding: 28px 16px 8px; }

			.card { padding: 28px 18px 28px; border-radius: 22px; box-shadow: 5px 5px 0 var(--ink); }

			.beaker { font-size: 3.5rem; margin-bottom: 14px; }

			h1 { margin-bottom: 14px; }

			p.lead { font-size: 1rem; margin-bottom: 24px; }

			/* full-width, thumb-friendly button */
			.cta { display: flex; justify-content: center; width: 100%; min-height: 52px; padding: 12px 20px; font-size: 1.1rem; }

			:root { --tile: 220px; }

			/* stack the fine print into tidy, tappable rows */
			footer { padding: 12px 16px 24px; }
			footer .cols { gap: 12px 24px; }
			footer li a { padding: 6px 0; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation: none !important; transition: none !important; }
		}
	</style>
